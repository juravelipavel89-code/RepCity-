name: Build RepCity APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          unzip RepCity_0_4_Accounts_CloudSync.zip -d source
          flutter create --platforms=android --project-name repcity build_app
          cp source/RepCity/pubspec.yaml build_app/pubspec.yaml
          cp -R source/RepCity/lib/. build_app/lib/

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RepCity-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
